<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CLAREVO - Protótipo navegável para celular</title>
<style>
:root{--blue:#2457F5;--lime:#D4F05B;--ink:#17223B;--dim:#63738d;--line:#e0e7f4;--bg:#f4f7fd;--white:#fff;--radius:18px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:Manrope,Inter,system-ui,-apple-system,sans-serif;line-height:1.45;color:var(--ink);background:var(--bg);margin:0}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #9cafff;outline-offset:2px}header{background:#fff;border-bottom:1px solid var(--line);padding:17px max(16px,calc((100vw - 660px)/2));display:flex;justify-content:space-between;align-items:center;gap:8px}header .logo{color:var(--blue);font-size:24px;font-weight:850;letter-spacing:-1px}header .logo span{color:#9bbd18}header .hint{font-size:10px;padding:6px 9px;border-radius:8px;background:var(--lime);font-weight:850}main{padding:20px 15px 80px;max-width:690px;margin:0 auto;min-height:60vh}h1{font-size:26px;letter-spacing:-.9px;line-height:1.2;margin:5px 0 6px}h2{font-size:17px;letter-spacing:-.4px;margin:0 0 6px}p{margin:0 0 10px}.small{font-size:12px;color:var(--dim);line-height:1.6}.eyebrow{font-size:10px;color:#617494;letter-spacing:.11em;font-weight:850;text-transform:uppercase}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:17px;margin-top:13px;box-shadow:0 3px 14px #26375a06}.hero{background:var(--blue);color:white}.hero .small,.hero .muted{color:#dde6ff}.big{font-size:34px;font-weight:850;letter-spacing:-1px}.medium{font-size:22px;font-weight:850}.muted{font-size:11px;color:var(--dim)}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metrics .card{margin-top:10px}.tag{background:var(--lime);font-size:11px;font-weight:800;border-radius:8px;padding:5px 9px}.note{background:#edf2fc;border-radius:12px;padding:11px;font-size:11px;line-height:1.6;margin-top:12px}.tabs{display:flex;gap:7px;overflow-x:auto;padding:14px 1px 8px;scrollbar-width:none}.tab{border:none;background:#e8edf9;color:#4b5d7a;font-size:12px;font-weight:800;padding:10px 14px;border-radius:12px;white-space:nowrap}.tab.active{color:#fff;background:var(--blue)}.nav{display:flex;justify-content:center;gap:5px;padding:12px 10px;background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3;overflow-x:auto}.nav button{font-size:12px;flex:1;min-width:75px;max-width:145px;padding:12px 8px;border:0;border-radius:12px;background:none;color:#667795;font-weight:750}.nav button.active{background:#eaf0ff;color:var(--blue)}.primary{border:none;background:var(--blue);color:#fff;border-radius:11px;padding:11px 14px;font-weight:800;font-size:12px}.secondary{border:1px solid #d1dcf2;color:var(--blue);background:#fff;border-radius:11px;padding:9px 12px;font-size:12px;font-weight:800}.progress{height:11px;border-radius:20px;background:#e7edf7;overflow:hidden;margin:7px 0}.fill{height:100%;border-radius:20px}.barlabel{font-size:12px;display:flex;justify-content:space-between;gap:9px}.cluster{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;min-height:280px;padding:15px 0}.bubble{border:3px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;color:white;flex-shrink:0;min-width:65px;min-height:65px;padding:3px;line-height:1.15}.bubble.active{outline:3px solid #17223B;outline-offset:3px}.bubble span{font-size:10px;font-weight:750}.bubble strong{font-size:16px;margin-top:5px}.selection{background:#edf2fb;border-radius:12px;padding:14px}.list{list-style:none;margin:0;padding:0}.list li{display:flex;justify-content:space-between;border-bottom:1px solid #e6edf8;font-size:12px;padding:10px 0;gap:10px}.list li:last-child{border-bottom:none}.rowselect{display:flex;gap:12px;align-items:center;justify-content:space-between}.toggle{border:0;border-radius:100px;width:48px;height:28px;background:#bfcadd;position:relative;flex-shrink:0}.toggle.on{background:var(--blue)}.toggle:after{content:'';width:21px;height:21px;position:absolute;background:white;border-radius:100%;top:3.5px;left:3.5px;transition:transform .15s}.toggle.on:after{transform:translateX(20px)}.monthchips{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:12px 0}.monthchips button{padding:10px 2px;background:#edf2fa;border:1px solid transparent;border-radius:9px;font-size:11px;color:#4c5f7e}.monthchips button.active{border-color:var(--blue);color:var(--blue);font-weight:800}.monthchips button.off{opacity:.5;text-decoration:line-through}.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stats .card{background:#f2f5fb}.future{display:flex;justify-content:space-between;gap:7px;align-items:flex-end;height:188px;margin-top:15px}.fbar{flex:1;text-align:center;font-size:11px}.fbar .bar{width:75%;margin:auto;background:var(--blue);border-radius:6px 6px 0 0}.fbar .txt{font-size:10px;color:var(--dim);margin:4px 0}.fbar b{font-size:10px}select{max-width:100%;padding:10px;border:1px solid #d5e0f2;background:white;border-radius:10px;color:var(--ink)}input[type=range]{accent-color:var(--blue);width:100%}.clickrow{border:none;background:transparent;padding:7px 0;width:100%;text-align:left;cursor:pointer}svg{max-width:100%;height:auto}.footer{font-size:11px;color:#79889e;text-align:center;margin:24px 0}#app{width:100%}.screen{display:block}.divider{height:1px;background:var(--line);margin:12px 0}.status{font-size:11px;color:var(--blue);font-weight:750} .analysis-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:820px){header{padding-inline:max(25px,calc((100vw - 660px)/2))}.nav{border-radius:0}main{padding-top:27px}}@media(max-width:360px){h1{font-size:23px}.nav button{min-width:64px;font-size:10px}.card{padding:13px}.bubble span{font-size:9px}}
</style></head><body>
<header><div class="logo">clarevo<span>.</span></div><div style="display:flex;gap:8px;align-items:center"><span class="hint">DEMO FICTÍCIA</span><button class="secondary" id="privacy">Ocultar</button></div></header>
<nav class="nav" id="navigation" aria-label="Navegação principal"></nav>
<main id="app" aria-live="polite"></main>
<script>
const months=[{m:'Maio',inc:5900,pending:250,c:[1400,740,450,410,230,270]},{m:'Junho',inc:6000,pending:420,c:[1400,850,500,450,280,420]},{m:'Julho',inc:6200,pending:510,c:[1400,750,4880,400,300,170]},{m:'Agosto',inc:6100,pending:620,c:[1420,890,480,440,330,440]},{m:'Setembro',inc:6300,pending:530,c:[1420,950,540,470,330,490]},{m:'Outubro',inc:6400,pending:820,c:[1420,920,540,460,330,480]}];
const cats=['Moradia','Mercado','Transporte','Contas','Saúde','Lazer'],cs=['#2457F5','#18898D','#704CC7','#BF772C','#368665','#B7507F'],limit=[1500,1000,600,550,400,450];const future=[['Out',820],['Nov',2350],['Dez',2250],['Jan',2800],['Fev',2100],['Mar',1750]];const records=[[['Aluguel',1300],['Condomínio',120]],[['Supermercado',510],['Compras da semana',410]],[['Combustível',320],['Transporte por aplicativo',220]],[['Energia',210],['Internet',130],['Água',120]],[['Farmácia',145],['Consulta',185]],[['Restaurante',290],['Cinema',190]]];
const s={page:'home',tab:'cats',month:5,cat:1,mode:'bubble',focus:2,hidden:new Set(),installment:250,term:8,explain:false,private:false,lesson:0};const sum=a=>a.reduce((t,n)=>t+n,0),spent=m=>sum(m.c);const fmt=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(n);const money=n=>s.private?'R$ ••••':fmt(n);const pc=n=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1}).format(n)+'%'; const card=x=>'<div class="card">'+x+'</div>'; const head=(ey,title,sub)=>`<div class="eyebrow">${ey}</div><h1>${title}</h1><p class="small">${sub}</p>`; const picker=()=>`<select id="month" aria-label="Escolher mês">${months.map((m,i)=>`<option value="${i}" ${i===s.month?'selected':''}>${m.m} de 2026</option>`).join('')}</select>`;
function nav(){const navs=[['home','Início'],['analyses','Análises'],['plan','Planejar'],['learn','Aprender']];document.getElementById('navigation').innerHTML=navs.map(([v,t])=>`<button data-page="${v}" class="${s.page===v?'active':''}">${t}</button>`).join('');document.getElementById('privacy').textContent=s.private?'Exibir':'Ocultar'}
function home(){const m=months[s.month],paid=spent(m),diff=m.inc-paid;return head('Sua vida financeira','Seu mês, mais claro.','Consulte o que entrou, o que foi pago e o que ainda está previsto.')+picker()+`<div class="card hero"><div class="small">Diferença do mês</div><div class="big">${money(diff)}</div><p class="small">Recebido menos pagamentos registrados</p><div class="divider" style="background:#ffffff50"></div><div class="row"><span>Ainda a pagar</span><strong>${money(m.pending)}</strong></div></div><div class="metrics">${card(`<span class="muted">Recebido</span><div class="medium">${money(m.inc)}</div>`)}${card(`<span class="muted">Pago</span><div class="medium">${money(paid)}</div>`)}</div><div class="note">Após considerar as contas pendentes, a diferença ilustrativa é <strong>${money(diff-m.pending)}</strong>. Não equivale necessariamente a saldo bancário livre.</div>${card(`<div class="row"><h2>Distribuição das despesas</h2><button class="secondary" data-jump="cats">Explorar</button></div>${m.c.map((v,i)=>`<div style="margin:12px 0"><div class="barlabel"><span>${cats[i]}</span><b>${money(v)}</b></div><div class="progress"><div class="fill" style="width:${v/paid*100}%;background:${cs[i]}"></div></div></div>`).join('')}`)}${card(`<h2>Próximos passos</h2><p class="small">Acesse comparações históricas, compromissos futuros e simulações.</p><div class="row"><button class="primary" data-jump="evolution">Ver evolução</button><button class="secondary" data-jump="future">Ver futuro</button></div>`)}`}
function bubble(m){const total=spent(m);return '<div class="cluster">'+m.c.map((v,i)=>{const size=Math.min(148,Math.max(74,Math.round(30+2.45*Math.sqrt(v))));return `<button class="bubble ${s.cat===i?'active':''}" style="width:${size}px;height:${size}px;background:${cs[i]}" data-cat="${i}" aria-label="${cats[i]} ${pc(v/total*100)}"><span>${cats[i]}</span><strong>${pc(v/total*100)}</strong></button>`}).join('')+'</div>'}
function barlist(m){const max=Math.max(...m.c),total=spent(m);return m.c.map((v,i)=>`<button class="clickrow" data-cat="${i}"><div class="barlabel"><b>${cats[i]}</b><span>${money(v)} · ${pc(v/total*100)}</span></div><div class="progress"><div class="fill" style="width:${v/max*100}%;background:${cs[i]}"></div></div></button>`).join('')}
function categories(){const m=months[s.month],v=m.c[s.cat];return `<div class="row" style="flex-wrap:wrap">${picker()}<div><button class="tab ${s.mode==='bubble'?'active':''}" data-mode="bubble">Bolhas</button> <button class="tab ${s.mode==='bars'?'active':''}" data-mode="bars">Barras</button></div></div>${card(`<span class="muted">Despesas registradas em ${m.m}</span><div class="big">${money(spent(m))}</div><p class="small">Toque em uma categoria para consultar valores e detalhes.</p>${s.mode==='bubble'?bubble(m):barlist(m)}<div class="note">Bolhas: visão exploratória. Barras: comparação proporcional mais precisa. Categorias sem dupla contagem.</div>`)}${card(`<div class="row"><div><div class="muted">Categoria selecionada</div><h2>${cats[s.cat]}</h2></div><div style="text-align:right"><strong>${money(v)}</strong><div class="muted">${pc(v/spent(m)*100)} do total</div></div></div>${s.month===5?`<ul class="list">${records[s.cat].map(([n,val])=>`<li><span>${n}</span><b>${money(val)}</b></li>`).join('')}</ul>`:`<div class="note">Este mês possui apenas dados agregados fictícios. Lançamentos detalhados foram incluídos somente em outubro.</div>`}`)}`}
function chart(){const vals=months.map(spent),max=8500;const x=i=>38+ i*93;const y=v=>195-v/max*170;const seg=[];let p=[];vals.forEach((v,i)=>{if(s.hidden.has(i)){if(p.length>1)seg.push(p);p=[]}else{p.push([x(i),y(v)])}});if(p.length>1)seg.push(p);return `<svg viewBox="0 0 560 230" role="img" aria-label="Despesas por mês. Selecione um mês nos botões abaixo.">${[0,2000,4000,6000,8000].map(v=>`<line x1="35" x2="520" y1="${y(v)}" y2="${y(v)}" stroke="#E7EDF6"/><text x="29" y="${y(v)+3}" text-anchor="end" font-size="10" fill="#8D9AAF">${v/1000}k</text>`).join('')}${seg.map(points=>`<polyline points="${points.map(a=>a.join(',')).join(' ')}" fill="none" stroke="#2457F5" stroke-width="3"/>`).join('')}${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${s.focus===i?8:5}" fill="${s.hidden.has(i)?'#fff':s.focus===i?'#D4F05B':'#2457F5'}" stroke="${s.hidden.has(i)?'#9babc3':'#2457F5'}" stroke-dasharray="${s.hidden.has(i)?'3 2':'none'}" stroke-width="2"/>`).join('')}${months.map((m,i)=>`<text x="${x(i)}" y="220" text-anchor="middle" font-size="11" fill="${s.hidden.has(i)?'#9eaac0':'#4C5E78'}">${m.m.slice(0,3)}</text>`).join('')}</svg>`}
function evolution(){
const values=months.map(spent),selected=values.filter((_,i)=>!s.hidden.has(i));
const mean=selected.length?sum(selected)/selected.length:null;
const ordered=[...selected].sort((a,b)=>a-b);
const mid=ordered.length?(ordered.length%2?ordered[(ordered.length-1)/2]:(ordered[ordered.length/2]+ordered[ordered.length/2-1])/2):null;
const i=s.focus;
let html=card(`<div class="row"><h2>Despesas no tempo</h2><span class="tag">Interativo</span></div>${chart()}<div class="monthchips">${months.map((m,j)=>`<button data-point="${j}" class="${j===s.focus?'active':''} ${s.hidden.has(j)?'off':''}">${m.m.slice(0,3)}</button>`).join('')}</div><div class="row"><span class="muted">${s.hidden.size} mês(es) oculto(s)</span><button class="secondary" data-restore>Restaurar todos</button></div>`);
html+=card(`<div class="row"><div><span class="muted">Mês selecionado</span><h2>${months[i].m} de 2026</h2></div><div class="medium">${money(values[i])}</div></div><div class="rowselect" style="margin-top:17px"><div><strong style="font-size:12px">Mostrar este resultado na comparação</strong><div class="small">A opção não exclui lançamentos.</div></div><button class="toggle ${s.hidden.has(i)?'':'on'}" aria-pressed="${!s.hidden.has(i)}" aria-label="Mostrar este resultado" data-toggle></button></div>${i===2?'<div class="note">Julho inclui reparo do veículo de R$ 4.400, lançado em Transporte.</div>':''}`);
html+=`<div class="stats">${card(`<div class="muted">Média dos meses selecionados</div><div class="medium">${mean===null?'—':money(mean)}</div><div class="muted">${selected.length} meses</div>`)}${card(`<div class="muted">Mediana</div><div class="medium">${mid===null?'—':money(mid)}</div><div class="muted">Períodos visíveis</div>`)}</div>`;
html+=card(`<div class="row"><div><div class="muted">Total real do histórico</div><div class="medium">${money(sum(values))}</div></div><span class="tag">Inalterado</span></div><p class="small">Ocultar um mês afeta somente a comparação selecionada.</p>`);
let explanation='Análise baseada em registros e diferenças, sem avaliar escolhas pessoais.';
if(i===2) explanation='Julho apresenta uma despesa pontual com reparo do veículo, registrada em Transporte.';
else if(i===5) explanation='Outubro teve R$ 50 a menos de despesas que setembro, conforme o conjunto de dados fictício.';
else explanation='Consulte o detalhamento de categorias para investigar a diferença entre os períodos.';
html+=card(`<div class="row"><h2>Entender o que mudou</h2><button class="secondary" data-explain>${s.explain?'Fechar':'Expandir'}</button></div>${s.explain?`<div class="note">${explanation} Essa explicação não presume motivações pessoais.</div>`:'<p class="small">Análise baseada em registros e diferenças, sem avaliar escolhas pessoais.</p>'}`);
return html;
}
function futures(){return card(`<h2>Compromissos futuros</h2><p class="small">Valores previstos e fictícios. Não são pagamentos confirmados.</p><div class="future">${future.map(([t,v],i)=>`<div class="fbar"><div class="txt">${(v/1000).toFixed(1)}k</div><div class="bar" style="height:${v/2800*120}px;background:${i===3?'#18898D':'#2457F5'}"></div><b>${t}</b></div>`).join('')}</div><div class="note">Em janeiro foram considerados R$ 800 previstos para IPVA. Uma provisão não é um gasto realizado.</div>`)+card(`<h2>Novembro</h2><div class="row"><span class="small">Compromissos previstos</span><b>${money(2350)}</b></div><div class="row"><span class="small">Sobre renda fictícia de R$ 6.400</span><b>${pc(2350/6400*100)}</b></div><div class="progress"><div class="fill" style="width:${2350/6400*100}%;background:var(--blue)"></div></div><button class="primary" data-jump="scenario">Simular nova parcela</button>`)}
function budget(){const m=months[s.month];return card(`<div class="row" style="flex-wrap:wrap"><h2>Planejado × registrado</h2>${picker()}</div><p class="small">Limites ilustrativos definidos pela pessoa. O saldo de orçamento não corresponde ao saldo bancário.</p>${m.c.map((v,i)=>`<div style="margin:16px 0"><div class="barlabel"><b>${cats[i]}</b><span>${money(v)} / ${money(limit[i])}</span></div><div class="progress"><div class="fill" style="width:${Math.min(100,v/limit[i]*100)}%;background:${v>limit[i]?'#c58632':cs[i]}"></div></div><div class="muted">${pc(v/limit[i]*100)} utilizado${v>limit[i]?` · ${money(v-limit[i])} acima do planejado`:''}</div></div>`).join('')}<div class="note">O aviso de aproximação do limite deve ser neutro. O objetivo não é avaliar a qualidade das escolhas.</div>`) }
function analyses(){return head('Explore os registros','Análises financeiras','Escolha o tipo de comparação para investigar seus dados.')+`<div class="tabs">${[['cats','Categorias'],['evolution','Evolução'],['future','Futuro'],['budget','Orçamento']].map(([k,t])=>`<button class="tab ${s.tab===k?'active':''}" data-tab="${k}">${t}</button>`).join('')}</div>`+(s.tab==='cats'?categories():s.tab==='evolution'?evolution():s.tab==='future'?futures():budget())}
function planner(){const newV=s.installment,nov=2350+newV;return head('Antes de decidir','Simule uma compra','Altere a parcela para visualizar seu impacto. Esta simulação não cria lançamentos reais.')+card(`<div class="row"><h2>Parcela mensal</h2><span class="medium">${money(newV)}</span></div><input type="range" id="installment" min="50" max="1000" step="50" value="${newV}"/><div class="row"><span class="small">R$ 50</span><span class="small">R$ 1.000</span></div><div class="row" style="margin-top:15px"><h2>Número de parcelas</h2><strong>${s.term} meses</strong></div><input type="range" id="term" min="3" max="18" step="1" value="${s.term}"/><div class="note">${s.term} parcelas de ${money(newV)}. Total das parcelas: ${money(s.term*newV)}. Não há cálculo de juros ou CET nesta visualização simplificada.</div>`)+card(`<span class="muted">Compromissos previstos de novembro</span><div class="big">${money(nov)}</div><div class="row"><span class="small">Sem simulação</span><b>${money(2350)}</b></div><div class="row"><span class="small">Com simulação</span><b>${money(nov)}</b></div><div class="progress"><div class="fill" style="width:${nov/6400*100}%;background:var(--blue)"></div></div><div class="small">${pc(nov/6400*100)} da renda ilustrativa de R$ 6.400</div><div class="note">Estes números são estimativas de compromissos, não um saldo bancário previsto.</div>`) }
function learn(){const lessons=[['Compras no cartão e fatura','A compra representa consumo realizado. Quando a fatura é paga, o aplicativo precisa conciliar esse pagamento para não contar a mesma despesa duas vezes por categoria.'],['O que é renda comprometida?','É a parcela da renda destinada a obrigações segundo as regras definidas pelo aplicativo. Compare meses e diferencie pagamentos já feitos e compromissos previstos.'],['Por que a mediana pode ajudar?','Uma despesa extraordinária pode alterar a média. Consulte também a mediana e o histórico completo antes de interpretar o comportamento habitual.']];return head('Educação financeira','Aprender','Explicações relacionadas ao que você está observando no aplicativo.')+card(lessons.map(([name],i)=>`<button class="clickrow tab ${s.lesson===i?'active':''}" style="display:block;margin-bottom:8px;white-space:normal" data-lesson="${i}">${name}</button>`).join('')+`<div class="selection"><h2>${lessons[s.lesson][0]}</h2><p class="small">${lessons[s.lesson][1]}</p></div>`)+card(`<h2>Privacidade da apresentação</h2><p class="small">Você pode ocultar os valores exibidos. Este exemplo não acessa contas ou dados bancários.</p><div class="rowselect"><b>Ocultar valores</b><button class="toggle ${s.private?'on':''}" data-private aria-label="Ocultar valores"></button></div>`)}
function render(){nav();document.getElementById('app').innerHTML= (s.page==='home'?home():s.page==='analyses'?analyses():s.page==='plan'?planner():learn())+'<div class="footer">Protótipo independente • dados inteiramente fictícios • versão para revisão de interface</div>'}
function goTop(){window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;const d=btn.dataset;if(d.page){s.page=d.page;render();goTop()}else if(d.tab){s.tab=d.tab;render();goTop()}else if(d.jump){s.page=d.jump==='scenario'?'plan':'analyses';if(s.page==='analyses')s.tab=d.jump;render();goTop()}else if(d.cat!==undefined){s.cat=Number(d.cat);render()}else if(d.mode){s.mode=d.mode;render()}else if(d.point!==undefined){s.focus=Number(d.point);render()}else if(d.toggle!==undefined){s.hidden.has(s.focus)?s.hidden.delete(s.focus):s.hidden.add(s.focus);render()}else if(d.restore!==undefined){s.hidden.clear();render()}else if(d.private!==undefined||btn.id==='privacy'){s.private=!s.private;render()}else if(d.lesson!==undefined){s.lesson=Number(d.lesson);render()}else if(d.explain!==undefined){s.explain=!s.explain;render()}});
document.addEventListener('change',e=>{if(e.target.id==='month'){s.month=Number(e.target.value);render()}else if(e.target.id==='installment'){s.installment=Number(e.target.value);render()}else if(e.target.id==='term'){s.term=Number(e.target.value);render()}});
render();
</script></body></html>
