<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Modo escuro (D-096): a página segue o tema do aparelho, lido ao carregar. O alto do app é o azul da marca nos dois temas, então a cor
         da barra do navegador é a mesma. -->
    <meta name="color-scheme" content="light dark" />
    <!-- Instalação na tela de início (iOS e Android): nome, ícone e cor da Clarevo. -->
    <meta name="theme-color" content="#2457F5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Clarevo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* O fundo antes do app desenhar, nas cores do fundo da tela (theme/palettes.ts): claro e, no modo escuro, o azul-marinho. */
      html,
      body {
        background-color: #F6F8FC;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #131E3E;
        }
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      Para usar o app da Clarevo, ative o JavaScript no navegador.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
